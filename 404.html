<style>

:root {
  --void:        #06080b;
  --deep:        #090c11;
  --ink:         #f4f6fa;
  --ink-soft:    #d6dbe4;  --ink-dim:     #a9b2c4;
  --ink-faint:   #8b95ab;

  --beam:        #5bd8f2;  --beam-deep:   #1f9fd0;  --spark:       #2f7fe8;  --ember:       #f0743f;  --good:        #59e0a8;  --heart:       #e2495f;
  --surface:     #0c1016;
  --surface-lit: #11161e;
  --line:        rgba(150, 172, 200, 0.14);
  --line-lit:    rgba(150, 172, 200, 0.27);

  --radius:      16px;
  --radius-xs:   8px;
  --radius-pill: 999px;
  --shell:       1200px;
  --bar:         3.9rem;  --ease:        cubic-bezier(0.22, 1, 0.36, 1);

  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --void:      #f4f6fa;
    --deep:      #e9edf4;
    --ink:       #0a0f18;
    --ink-soft:  #232c3a;
    --ink-dim:   #3f4a5c;
    --ink-faint: #566173;
    --beam:      #0a6274;
    --beam-deep: #0b7b94;
    --spark:     #1462c0;
    --ember:     #9c4520;
    --good:      #0f7047;
    --heart:     #c0233b;
    --surface:     #ffffff;
    --surface-lit: #f6f9fc;
    --line:        rgba(10, 25, 45, 0.12);
    --line-lit:    rgba(10, 25, 45, 0.26);
    color-scheme: light;
  }
}

:root[data-theme="light"] {
  --void:      #f4f6fa;
  --deep:      #e9edf4;
  --ink:       #0a0f18;
  --ink-soft:  #232c3a;
  --ink-dim:   #3f4a5c;
  --ink-faint: #566173;
  --beam:      #0a6274;
  --beam-deep: #0b7b94;
  --spark:     #1462c0;
  --ember:     #9c4520;
  --good:      #0f7047;
  --heart:     #c0233b;
  --surface:     #ffffff;
  --surface-lit: #f6f9fc;
  --line:        rgba(10, 25, 45, 0.12);
  --line-lit:    rgba(10, 25, 45, 0.26);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--void);
  color: var(--ink);
  font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.ground {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
  background-color: var(--void);
}
.ground::before,
.ground::after {
  content: "";
  position: absolute;
  inset: -32vmax;
  will-change: transform;
}
.ground::before {
  background:
    radial-gradient(78vmax 58vmax at 72% 14%, color-mix(in srgb, var(--spark) 14%, transparent), transparent 72%),
    radial-gradient(64vmax 50vmax at 18% 72%, color-mix(in srgb, var(--beam) 7%, transparent), transparent 70%);
  animation: tide-a 46s ease-in-out infinite alternate;
}
.ground::after {
  background:
    radial-gradient(70vmax 54vmax at 34% 18%, color-mix(in srgb, var(--beam-deep) 10%, transparent), transparent 74%),
    radial-gradient(86vmax 46vmax at 62% 96%, color-mix(in srgb, var(--spark) 8%, transparent), transparent 76%);
  animation: tide-b 34s ease-in-out infinite alternate;
}
@keyframes tide-a {
  from { transform: translate3d(-3%, -2%, 0) scale(1.04); }
  to   { transform: translate3d(3%, 2.5%, 0) scale(1.12); }
}
@keyframes tide-b {
  from { transform: translate3d(2.5%, 2%, 0) scale(1.1); }
  to   { transform: translate3d(-2%, -2.5%, 0) scale(1.02); }
}

.scrim {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(120vmax 90vmax at 50% 26%, transparent 30%, color-mix(in srgb, var(--void) 60%, transparent) 100%),
    linear-gradient(color-mix(in srgb, var(--void) 44%, transparent), color-mix(in srgb, var(--void) 44%, transparent));
}

h1, h2 { font-family: Manrope, ui-sans-serif, system-ui, sans-serif; margin: 0; }
h1 {
  font-size: clamp(2.05rem, 1.25rem + 2.6vw, 3.25rem);
  font-weight: 600;
  line-height: 1.14;
  letter-spacing: -0.028em;
  max-width: 26ch;
  color: var(--ink-soft);
  text-wrap: balance;
}
h2 { font-size: 1.04rem; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
code { font-family: "JetBrains Mono", ui-monospace, monospace; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--beam); outline-offset: 3px; border-radius: 8px; }

.lit { color: var(--ink); }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.66rem;
  letter-spacing: 0.16em;
  color: var(--ink-faint);
  margin: 0 0 1.1rem;
}
.eyebrow::before {
  content: "";
  width: 24px;
  height: 1px;
  background: var(--line-lit);
  animation: draw 0.5s var(--ease) 0.2s both;
}
@keyframes draw { from { width: 0; } }

.lede {
  color: var(--ink-dim);
  font-size: clamp(1.02rem, 0.98rem + 0.3vw, 1.16rem);
  max-width: 58ch;
  margin: 1.2rem 0 0;
}

.shell {
  width: min(100% - clamp(1.5rem, 6vw, 5rem), var(--shell));
  margin-inline: auto;
}
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-block: clamp(1rem, 3vh, 2.5rem);
}
.hero { display: grid; gap: clamp(1.4rem, 4vh, 3rem); }
.note { color: var(--ink-faint); font-size: 0.88rem; margin-top: 1.15rem; max-width: 54ch; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.16fr) minmax(0, 0.84fr); gap: clamp(1.6rem, 3.5vw, 3.4rem); align-items: center; }
@media (max-width: 950px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }

.panel {
  position: relative;
  background: var(--surface);
  border-radius: var(--radius);
}
.panel::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(140deg, var(--line-lit), var(--line) 38%, var(--line) 62%, var(--line-lit));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
}
.panel::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  z-index: -1;
  opacity: 0.12;
  filter: blur(16px);
  background: linear-gradient(140deg, var(--beam), var(--spark));
}

.card {
  position: relative;
  padding: 1.35rem 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  background-color: var(--surface);
  border-radius: var(--radius);
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: var(--line);
  opacity: 1;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
}
.card::after { content: none; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: clamp(0.9rem, 1.6vw, 1.3rem); margin-top: clamp(1.8rem, 3vw, 2.6rem); }

.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.9rem; }
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.85rem 1.5rem;
  border-radius: var(--radius-xs);
  text-decoration: none;
  font-family: Manrope, sans-serif;
  font-weight: 600;
  font-size: 0.94rem;
  color: #04121b;
  background: var(--beam);
  border: 0;
  transition: transform 0.2s var(--ease), background 0.2s var(--ease);
}
.btn:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--beam) 88%, #ffffff); }
.btn:active { transform: scale(0.98); }
.btn svg { width: 1.05rem; height: 1.05rem; }
.topbar {
  flex: none;
  height: var(--bar);
  display: flex;
  align-items: center;
  background: color-mix(in srgb, var(--void) 76%, transparent);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
}
.topbar-inner { display: flex; align-items: center; gap: 0.7rem; width: min(100% - clamp(1.5rem, 6vw, 5rem), var(--shell)); margin-inline: auto; }
.brand { display: flex; align-items: center; gap: 0.7rem; margin-right: auto; }
.wordmark { position: relative; font-family: Manrope, sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em; text-decoration: none; }
.wordmark span { color: var(--beam); }
.pill-ver { font-family: "JetBrains Mono", monospace; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--ink-faint); background: var(--surface-lit); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 0.24rem 0.58rem; }

.term { display: flex; flex-direction: column; height: clamp(17.25rem, 40vh, 23rem); overflow: hidden; }
.term-bar { display: flex; align-items: center; gap: 0.55rem; padding: 0.8rem 1.15rem; border-bottom: 1px solid var(--line); font-family: "JetBrains Mono", monospace; font-size: 0.63rem; letter-spacing: 0.1em; color: var(--ink-faint); background: var(--surface-lit); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ember); flex: none; }
.term-body { flex: 1; min-height: 0; overflow: auto; background: var(--deep); font-family: "JetBrains Mono", monospace; font-size: 0.76rem; line-height: 1.5; padding: 0.85rem 1.1rem 0.95rem; color: var(--ink-dim); scrollbar-width: thin; }
.term-body .l { display: block; white-space: pre-wrap; }
.term-body .cmd { color: var(--beam); }
.term-body .dim { color: var(--ink-faint); }
.term-body .ok { color: var(--good); }
.term-body .fin { animation: settle 0.85s var(--ease); }
@keyframes settle { from { color: var(--ink-faint); } }
.caret { display: inline-block; width: 0.55em; height: 1.05em; vertical-align: -0.18em; background: var(--beam); animation: blink 1.05s steps(2, start) infinite; }
.caret.rest { animation: none; opacity: 0.35; }
@keyframes blink { to { visibility: hidden; } }
@media (max-width: 520px) {
  .term-body { font-size: 0.75rem; padding: 0.9rem 0.95rem 1.1rem; }
  .term-bar { padding: 0.7rem 1rem; }
}

.hero .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 0; gap: clamp(0.7rem, 1.4vw, 1.15rem); }
.plat .card { padding: clamp(1rem, 1.7vh, 1.4rem) 1.2rem; gap: 0.85rem; }
.plat h2 { font-size: 1rem; margin: 0; letter-spacing: -0.01em; }
.card-top { display: flex; align-items: center; gap: 0.7rem; }
.card-name { display: flex; flex-direction: column; gap: 0.06rem; min-width: 0; }
.task { display: flex; flex-direction: column; gap: 0.28rem; padding-top: 0.85rem; border-top: 1px solid var(--line); }
.task-label { font-family: "JetBrains Mono", monospace; font-size: 0.56rem; letter-spacing: 0.11em; color: var(--ink-faint); margin: 0; }
.answer { font-size: 1rem; font-weight: 600; line-height: 1.3; color: var(--ink); margin: 0; }
.detail { font-size: 0.83rem; line-height: 1.45; color: var(--ink-dim); margin: 0; }
@media (max-width: 900px) { .hero .cards { grid-template-columns: minmax(0, 1fr); } }
.os { font-family: "JetBrains Mono", monospace; font-size: 0.58rem; letter-spacing: 0.09em; color: var(--ink-faint); margin: 0; }
.card.mine { background-color: var(--surface-lit); }
.you {
  margin-left: auto;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 0.42rem;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.005em;
  color: var(--ink-dim);
  background: var(--surface-lit);
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  padding: 0.24rem 0.62rem 0.24rem 0.5rem;
  white-space: nowrap;
}
.you::before {
  content: "";
  width: 5px;
  height: 5px;
  flex: none;
  border-radius: 50%;
  background: var(--beam);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--beam) 15%, transparent);
}
.ico { width: 1.45rem; height: 1.45rem; flex: none; color: var(--ink-dim); fill: currentColor; }
.sprite { display: none; }
.btn-ico { width: 1.05rem; height: 1.05rem; flex: none; fill: currentColor; }

.cmdline { display: flex; align-items: center; gap: 0.3rem; margin: 0.12rem 0 0.1rem; font-family: "JetBrains Mono", monospace; font-size: 0.64rem; color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); border: 1px solid var(--line); border-radius: var(--radius-xs); padding: 0.28rem 0.28rem 0.28rem 0.5rem; }
.cmdline code { overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.copy {
  flex: none;
  display: grid;
  place-items: center;
  width: 1.5rem;
  height: 1.5rem;
  padding: 0;
  border: 0;
  border-radius: calc(var(--radius-xs) - 3px);
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
  transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.copy:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); }
.copy.done { color: var(--good); }
.copy svg { width: 0.9rem; height: 0.9rem; }
.copy .yes { display: none; }
.copy.done .yes { display: block; }
.copy.done .no { display: none; }

.switch {
  display: flex;
  gap: 0.15rem;
  padding: 0.22rem;
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--ink) 6%, transparent);
  border: 1px solid var(--line);
}
.switch a {
  display: block;
  text-decoration: none;
  color: var(--ink-faint);
  font: 700 0.68rem/1 "JetBrains Mono", monospace;
  letter-spacing: 0.08em;
  padding: 0.34rem 0.66rem;
  border-radius: var(--radius-pill);
  transition: background 0.22s var(--ease), color 0.22s var(--ease);
}
.switch a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.switch a[aria-current="page"] {
  background: color-mix(in srgb, var(--beam) 15%, transparent);
  color: var(--beam);
}
.switch a[aria-current="page"]:hover { background: color-mix(in srgb, var(--beam) 15%, transparent); color: var(--beam); }

.switch::after { content: none; }

.foot { flex: none; border-top: 1px solid var(--line); }
.foot-inner { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.4rem 1.8rem; padding-block: clamp(0.7rem, 1.8vh, 1.15rem); }
@media (max-width: 640px) {
  .foot-inner { justify-content: center; text-align: center; gap: 0.5rem; }
  .credit { justify-content: center; }
}
.foot-note { font-family: "JetBrains Mono", monospace; font-size: 0.6rem; letter-spacing: 0.09em; color: var(--ink-faint); margin: 0; }
.credit { display: inline-flex; align-items: center; gap: 0.34rem; font-size: 0.8rem; color: var(--ink-faint); margin: 0; }
.credit a { position: relative; color: var(--ink-dim); font-weight: 600; text-decoration: none; transition: color 0.2s var(--ease); }
.credit a:hover { color: var(--ink); }
.heart { width: 0.85rem; height: 0.85rem; flex: none; color: var(--heart); animation: beat 1.6s var(--ease) infinite; transform-origin: center; }
@keyframes beat {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.26); }
  28% { transform: scale(1); }
  42% { transform: scale(1.18); }
  56% { transform: scale(1); }
}

.wordmark::after,
.credit a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -3px;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s var(--ease);
}
.wordmark:hover::after,
.credit a:hover::after { transform: scaleX(1); }

@media (min-width: 951px) and (max-height: 840px) {
  main { padding-block: clamp(0.5rem, 1.5vh, 1.2rem); }
  .hero { gap: clamp(1rem, 2.5vh, 1.8rem); }
  .term { height: clamp(14.75rem, 34vh, 20rem); }
  .term-body { font-size: 0.68rem; line-height: 1.4; padding: 0.7rem 1rem 0.7rem; }
  .eyebrow { margin-bottom: 0.8rem; }
  h1 { font-size: clamp(1.85rem, 1.1rem + 1.9vw, 2.5rem); }
  .lede { font-size: 1rem; margin-top: 0.9rem; }
  .actions { margin-top: 1.2rem; }
  .btn { padding: 0.75rem 1.45rem; }
  .note { margin-top: 0.75rem; font-size: 0.82rem; }
  .answer { font-size: 0.94rem; }
  .detail { font-size: 0.79rem; }
}

.rise { animation: rise 0.55s var(--ease) both; }
.rise.d1 { animation-delay: 0.07s; }
.rise.d2 { animation-delay: 0.14s; }
.rise.d3 { animation-delay: 0.21s; }
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
}

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (prefers-reduced-transparency: reduce) {
  .topbar { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--surface); }
  .ground::before, .ground::after { animation: none; opacity: 0.5; }
}
</style>
</head>
